name: Testes automatizados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: https://practicesoftwaretesting.com
  API_URL: https://restful-booker.herokuapp.com

jobs:
  testes-de-api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes de API
        run: npm run test:api

      - name: Resumo da execução
        if: always()
        run: node scripts/ci-summary.mjs "Testes de API" reports/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-api
          path: |
            reports/html
            reports/results.json
            reports/junit.xml
          retention-days: 7

  testes-e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # A loja demo fica atrás de proteção anti-bot e costuma bloquear IP de runner
      # de CI. Se estiver bloqueada, o E2E não roda aqui (rode na máquina local).
      - name: Checar acesso aos sites
        id: checar
        run: |
          if node scripts/check-targets.mjs; then
            echo "liberado=true" >> "$GITHUB_OUTPUT"
          else
            echo "liberado=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rodar testes E2E
        if: steps.checar.outputs.liberado == 'true'
        run: npm run test:e2e

      - name: Aviso quando o E2E não pôde rodar
        if: steps.checar.outputs.liberado != 'true'
        run: |
          echo "::warning::E2E não executado: o site demo bloqueou o acesso a partir do runner."
          {
            echo "## Testes E2E"
            echo ""
            echo "Não executados neste runner: o site demo respondeu com bloqueio anti-bot."
            echo "Rode localmente com \`npm run test:e2e\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resumo da execução
        if: always()
        run: node scripts/ci-summary.mjs "Testes E2E" reports/results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório e evidências
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-e2e
          path: |
            reports/html
            reports/results.json
            reports/junit.xml
            test-results
          retention-days: 7

  teste-de-carga:
    name: Carga (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: grafana/setup-k6-action@v1

      - name: Rodar smoke de carga
        run: k6 run -e SCENARIO=smoke k6/load-test.js

      - name: Publicar resumo do k6
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resumo-k6
          path: reports/k6-summary.json
          retention-days: 7
